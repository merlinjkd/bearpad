[package]
name = "bearpad"
version = "0.2.13"
description = "Bearpad - a fast, local markdown/text editor"
authors = ["you"]
edition = "2021"

[lib]
name = "bearpad_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hunspell-rs = "0.4.0"
